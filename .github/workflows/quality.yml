name: Quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  WRANGLER_SEND_METRICS: 'false'
concurrency:
  group: quality-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  offline-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-data.txt
      - name: Install PDF extraction dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          pdftotext -v
      - run: npm ci
      - run: python -m pip install -r requirements-data.txt
      - run: python scripts/check_secrets.py
      - run: npm run check
      - run: python -m pipeline.verify_artifacts
      - run: npm run deploy:dry
      - run: npm run db:local
      - run: python scripts/verify_rules_import.py
      - run: npm run test:smoke
      - run: npm run test:bot
      - name: Backup and restore public data only
        run: |
          python -m pipeline.public_backup create --directory artifacts/ci-public-backup
          python -m pipeline.public_backup restore --directory artifacts/ci-public-backup --destination artifacts/ci-restored.sqlite
      - name: Assert clean artifact replay
        run: git diff --exit-code
